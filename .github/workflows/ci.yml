name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage pylint

      - name: Run tests with coverage
        run: |
          coverage run -m pytest -q
          coverage xml -i
          coverage report

      - name: Upload coverage.xml artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Run pylint (non-blocking)
        run: |
          # Run pylint but do not fail the job; review output in logs
          pylint --exit-zero .
